<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div>
        <a  class="menu" href="index.html">Sobre mim</a>
        <a  class="menu" href="contato.html">Contato</a>
    </div>

    <h1 class="titulo">Entre em contato comigo</h1>
    
    <h2 class="subtitulo">Preencha o Formulário:</h2>

    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" placeholder="insira seu nome..." onkeyup="validaNome()">
        <div id="txtNome"></div>
        <br>

        <label for="telefone">Telefone:</label><br>
        <input type="number" id="telefone" name="telefone" placeholder="insira seu telefone...">
        <br><br>

        <label for="email">E-mail:</label><br>
        <input type="text" id="email" placeholder="insira seu email..." onkeyup="validaEmail()">
        <div id="txtEmail"></div>
        <br>

        <label for="assunto">Assunto:</label><br>
        <input type="text" id="assunto" placeholder="insira o assunto..." onkeyup="validaAssunto()">
        <div id="txtAssunto"></div>
        <br><br>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagem" name="mensagem" cols="60" rows="5" placeholder="insira sua mensagem..."></textarea>
        <br><br>

        <button onclick="enviar()">Enviar</button>

        

    </form>

    <script src="assets/js/script.js"></script>
</body>
</html>
